<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wokwi 6x10 RGB Matrix</title>
    <link rel="stylesheet" href="/public/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="sim-panel" aria-label="RGB LED matrix simulator">
        <div class="topbar">
          <div>
            <h1>6x10 RGB Matrix</h1>
            <p>Arduino Uno sketch for a Wokwi WS2812 matrix on pin 6.</p>
          </div>
          <div class="run-state" aria-live="polite">
            <span class="pulse"></span>
            <span id="runLabel">Running</span>
          </div>
        </div>

        <div class="matrix-stage">
          <div id="matrix" class="matrix" role="img" aria-label="Animated 6 row by 10 column RGB LED matrix"></div>
        </div>

        <div class="controls" aria-label="Animation controls">
          <button id="toggleRun" type="button" title="Pause or resume animation">Pause</button>
          <label>
            Animation
            <select id="animationSelect"></select>
          </label>
          <label>
            Speed
            <input id="speed" type="range" min="25" max="200" value="100">
          </label>
          <output id="frameOut" for="speed">Frame 0</output>
        </div>
      </section>

      <aside class="code-panel" aria-label="Arduino sketch and Wokwi files">
        <div class="tabs" role="tablist" aria-label="Project files">
          <button class="tab active" type="button" data-file="/wokwi/sketch.ino">sketch.ino</button>
          <button class="tab" type="button" data-file="/wokwi/MatrixTools.h">MatrixTools.h</button>
          <button class="tab" type="button" data-file="/wokwi/FramePlayer.h">FramePlayer.h</button>
          <button class="tab" type="button" data-file="/wokwi/Heart.h">Heart.h</button>
          <button class="tab" type="button" data-file="/wokwi/DiagonalSweep.h">DiagonalSweep.h</button>
          <button class="tab" type="button" data-file="/wokwi/Sparkle.h">Sparkle.h</button>
          <button class="tab" type="button" data-file="/wokwi/diagram.json">diagram.json</button>
          <button class="tab" type="button" data-file="/wokwi/libraries.txt">libraries.txt</button>
        </div>
        <pre id="codeView" class="code-view" tabindex="0">Loading sketch...</pre>
      </aside>
    </main>
    <script type="module" src="/public/app.js"></script>
  </body>
</html>
